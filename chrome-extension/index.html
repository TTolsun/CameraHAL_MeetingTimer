<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1a1a1a">
  <title>회의 타이머</title>
  <link rel="stylesheet" href="timer.css">
  <script defer src="time-model.js"></script>
  <script defer src="timer.js"></script>
</head>
<body>
  <main class="timer" aria-label="회의 타이머">
    <header class="strip">
      <span class="strip-now">현재 <time id="now"></time></span>
      <span class="strip-delta" id="delta" title="첫 발표 배정 시간과의 차이" hidden>계획 대비 <b id="deltaValue"></b></span>
      <span class="strip-end">종료 <time id="deadline"></time></span>
      <span id="left"></span>
    </header>
    <section class="stage" aria-label="현재 발표">
      <div class="stage-head">
        <h1 id="speaker"></h1><span id="status"></span>
        <button class="icon-button reset-size" id="resetSize" hidden></button>
      </div>
      <div class="clockFrame"><div id="clock" role="timer">00:00</div></div>
      <p id="budget"></p><p id="notice" role="status"></p>
      <div id="segments" aria-hidden="true"></div>
    </section>
    <footer class="actions" aria-label="타이머 조작">
      <button class="primary" id="run">시작</button><button class="ink" id="next" hidden>다음</button>
      <button class="icon-button" id="undo" aria-keyshortcuts="Control+Z" disabled></button>
      <button class="icon-button" id="edit"></button>
      <button id="mini" aria-keyshortcuts="B" title="발표 막대 열기 (B)">발표 막대 열기</button>
    </footer>
  </main>
  <template id="barTemplate">
    <main class="miniBar" aria-label="발표 막대">
      <div class="barState"><b class="count"></b><span class="message" role="status"></span></div>
      <div class="miniClockFrame"><span class="miniClock" role="timer"></span></div>
      <div class="controls">
        <button class="primary icon-button" data-action="run" aria-keyshortcuts="Space"></button>
        <button class="ink icon-button" data-action="next" aria-keyshortcuts="N ArrowRight"></button>
        <button class="icon-button" data-action="undo" aria-keyshortcuts="Control+Z"></button>
        <button class="icon-button" data-action="reset" hidden></button>
        <button class="icon-button" data-action="back" aria-keyshortcuts="B Escape"></button>
      </div>
      <div class="track" aria-hidden="true"><i></i></div>
    </main>
  </template>
  <template id="icons">
    <svg data-icon="play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7Z" fill="currentColor"/></svg>
    <svg data-icon="pause" viewBox="0 0 24 24"><path d="M9 5v14m6-14v14" stroke-width="3"/></svg>
    <svg data-icon="skip" viewBox="0 0 24 24"><path d="m5 5 11 7-11 7Z" fill="currentColor"/><path d="M19 5v14"/></svg>
    <svg data-icon="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg>
    <svg data-icon="undo" viewBox="0 0 24 24"><path d="M9 5 4 10l5 5m-5-5h10a5 5 0 0 1 0 10h-3"/></svg>
    <svg data-icon="settings" viewBox="0 0 24 24"><path d="M5 4v3m0 4v9m7-16v9m0 4v3m7-16v3m0 4v9M2 7h6m1 10h6m1-10h6"/></svg>
    <svg data-icon="back" viewBox="0 0 24 24"><path d="M8 9V5a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2M8 8h13M3 13h11m-3-3 3 3-3 3"/></svg>
    <svg data-icon="reset-size" viewBox="0 0 24 24"><path d="M7 4H4v3m13-3h3v3m0 10v3h-3m-10 0H4v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
    <svg data-icon="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg>
    <svg data-icon="moon" viewBox="0 0 24 24"><path d="M20.3 15.1A9 9 0 0 1 8.9 3.7 9 9 0 1 0 20.3 15.1Z"/></svg>
    <svg data-icon="bar" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h4m4 0h2"/></svg>
  </template>
  <dialog id="settings" aria-labelledby="settingsTitle"><form id="settingsForm">
    <div class="dialogHead"><h2 id="settingsTitle">회의 설정</h2><button type="button" id="theme" class="icon-button"></button></div>
    <div class="settingFields">
      <label><span id="endLabel">회의 종료 시각</span><input id="endInput" type="time" required autofocus></label>
      <label>발표 인원<input id="countInput" type="number" min="1" max="50" step="1" required></label>
    </div>
    <div class="dialogFoot">
      <p id="settingHint" role="status"></p>
      <div class="dialogActions"><button type="button" id="cancel">취소</button><button class="primary" type="submit">저장</button></div>
    </div>
  </form></dialog>
</body>
</html>
